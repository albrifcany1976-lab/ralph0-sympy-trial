# Ralph T-B executor (E2) — for albrifcany1976-lab/ralph0-sympy-trial, default branch.
# DRAFT FOR REVIEW — R6. Not published. Action pinned to v1.0.254 (Claude Code 2.1.304);
# model claude-sonnet-5-5 at effort low (proposal for this probe only; no automatic substitute).
# The model credential exists only in job "execute" (read-only token, no write).
# Job "commit" has write to this repository only and never sees the model credential.
name: Ralph T-B executor (E2)
run-name: tb-exec ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: "T-B operation id: tb-YYYYMMDD-<8 lowercase hex>"
        required: true
        type: string
permissions: {}
concurrency:
  group: ralph-tb-executor
  cancel-in-progress: false
env:
  BASE_SHA: d9b18c518d64d0ebe8e35a98c2fb519938b9b151
  TARGET_FILE: sympy/polys/monomials.py
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      patch_b64: ${{ steps.patch.outputs.patch_b64 }}
    steps:
      - name: Validate launch
        env:
          OP: ${{ inputs.operation_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$OP" =~ ^tb-[0-9]{8}-[0-9a-f]{8}$ ]]
          test "$ATTEMPT" = 1
      - name: Checkout fixed base only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight — exact Claude Code 2.1.304 and required flags (no credential, no model call)
        id: cc
        # Same official installer and version the pinned action would use; this step sees no secret.
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.304
          CC="$HOME/.local/bin/claude"
          test -x "$CC"
          "$CC" --version > "$RUNNER_TEMP/cc-version.txt"
          grep -Eq '^2\.1\.304( |$)' "$RUNNER_TEMP/cc-version.txt"
          "$CC" --help > "$RUNNER_TEMP/cc-help.txt"
          for f in --tools --allowedTools --disallowedTools --strict-mcp-config --mcp-config --setting-sources --effort --model; do
            # Option column only (two leading spaces), so a flag mentioned in another flag's
            # wrapped description does not count as supported.
            grep -Eq -- "^  $f([ ,<]|$)" "$RUNNER_TEMP/cc-help.txt" || { echo "MISSING_FLAG $f" >&2; exit 1; }
          done
          echo "path=$CC" >> "$GITHUB_OUTPUT"
          echo "claude_code=$(cat "$RUNNER_TEMP/cc-version.txt") sha256=$(sha256sum "$CC" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Executor — Claude Code, subscription token, fixed task
        id: claude
        # anthropics/claude-code-action v1.0.254 = commit db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c
        # (annotated tag object c335fd6d1b8bce8aad42d9eb68d14929b15de8da; its code pins Claude Code 2.1.304).
        # Nested action used at run time: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6.
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only job token instead of the shared Claude GitHub App identity (also avoids OIDC).
          github_token: ${{ github.token }}
          # Use the binary verified in the preflight step; the action then skips its own install.
          path_to_claude_code_executable: ${{ steps.cc.outputs.path }}
          plugins: ""
          plugin_marketplaces: ""
          use_commit_signing: "false"
          show_full_output: "false"
          display_report: "false"
          track_progress: "false"
          prompt: |
            Fixed T-B task. Edit exactly one file: sympy/polys/monomials.py.
            Insert exactly one new line containing only:
            # ralph-tb: ${{ inputs.operation_id }}
            immediately above the line that begins with "def itermonomials(".
            Change nothing else. Do not create, delete, rename or reformat any file.
          # Model: claude-sonnet-5-5 (dateless ID = fixed snapshot), effort low; no --fallback-model.
          # --tools limits the AVAILABLE built-in tools to Read and Edit; --allowedTools only pre-approves.
          # MCP: action adds no server here (agent mode, no mcp__ tool named, signing off); the empty
          # inline config + --strict-mcp-config ignores every other MCP source (incl. a repo .mcp.json),
          # and the action's own servers are also denied by name. --setting-sources user keeps
          # repository settings out (2.1.304 limitation: fixed fully only in 2.1.314).
          # This is TOOL RESTRICTION, NOT NETWORK ISOLATION: the runner is online and the CLI
          # calls the model API.
          claude_args: |
            --max-turns 6
            --model claude-sonnet-5-5
            --effort low
            --tools "Read,Edit"
            --allowedTools "Read,Edit"
            --disallowedTools "mcp__github_comment,mcp__github_file_ops,mcp__github_inline_comment,mcp__github_ci,mcp__github"
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'
            --setting-sources user
      - name: Verify the model actually used (no substitution)
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          python3 - "$EXEC_FILE" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          seen = set()
          for m in (data if isinstance(data, list) else [data]):
              if not isinstance(m, dict):
                  continue
              inner = m.get('message')
              if m.get('type') == 'assistant' and isinstance(inner, dict) and inner.get('model'):
                  seen.add(inner['model'])
              if isinstance(m.get('modelUsage'), dict):
                  seen.update(m['modelUsage'].keys())
          print('models seen:', sorted(seen))
          if seen != {'claude-sonnet-5-5'}:
              sys.exit('REJECTED_MODEL_NOT_EXACTLY_claude-sonnet-5-5')
          PY
      - name: Build and bound the patch
        id: patch
        run: |
          set -euo pipefail
          git status --porcelain
          git add -N .
          changed="$(git diff --name-only HEAD)"
          test "$changed" = "$TARGET_FILE"
          git diff --binary HEAD > "$RUNNER_TEMP/tb.patch"
          size=$(stat -c%s "$RUNNER_TEMP/tb.patch")
          test "$size" -gt 0
          test "$size" -le 32768
          if grep -q 'GIT binary patch' "$RUNNER_TEMP/tb.patch"; then exit 1; fi
          echo "patch_b64=$(base64 -w0 "$RUNNER_TEMP/tb.patch")" >> "$GITHUB_OUTPUT"

  commit:
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout fixed base (no model credential in this job)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
      - name: Validate scope, commit, push op branch without force
        env:
          OP: ${{ inputs.operation_id }}
          PATCH_B64: ${{ needs.execute.outputs.patch_b64 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$OP" =~ ^tb-[0-9]{8}-[0-9a-f]{8}$ ]]
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/tb.patch"
          git apply --check --index "$RUNNER_TEMP/tb.patch"
          git apply --index "$RUNNER_TEMP/tb.patch"
          G() { GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -c core.hooksPath=/dev/null "$@"; }
          raw="$(G diff --cached --raw -z --no-renames --abbrev=40 "$BASE_SHA" | tr '\0' '\n')"
          test "$(printf '%s\n' "$raw" | grep -c '^:')" = 1
          printf '%s\n' "$raw" | grep -Eq '^:100644 100644 [0-9a-f]{40} [0-9a-f]{40} M$'
          test "$(G diff --cached --name-only "$BASE_SHA")" = "$TARGET_FILE"
          # Exact expected edit: base file byte-for-byte plus ONE line "# ralph-tb: <OP>"
          # immediately above the unique "def itermonomials(" line. Anything else is rejected,
          # including any other change inside monomials.py. Checked in index AND working tree.
          python3 - "$BASE_SHA" "$TARGET_FILE" "$OP" <<'PY'
          import subprocess, sys
          base, target, op = sys.argv[1:4]
          git = lambda *a: subprocess.run(['git', *a], check=True, capture_output=True).stdout
          lines = git('show', f'{base}:{target}').splitlines(keepends=True)
          anchors = [i for i, l in enumerate(lines) if l.startswith(b'def itermonomials(')]
          if len(anchors) != 1:
              sys.exit('REJECTED_ANCHOR_NOT_UNIQUE')
          i = anchors[0]
          expected = b''.join(lines[:i]) + b'# ralph-tb: ' + op.encode() + b'\n' + b''.join(lines[i:])
          if git('show', f':{target}') != expected or open(target, 'rb').read() != expected:
              sys.exit('REJECTED_NOT_EXACT_EXPECTED_EDIT')
          PY
          # Same flags as the protected verifier's diff, so the digests can be compared.
          patch_sha=$(G diff --cached --no-ext-diff --no-textconv --no-renames --full-index --binary "$BASE_SHA" | sha256sum | cut -d' ' -f1)
          printf 'T-B %s\n\nRalph-Operation: %s\nRalph-Executor-Run: %s\nPatch-SHA256: %s\n' "$OP" "$OP" "$RUN_ID" "$patch_sha" > "$RUNNER_TEMP/msg"
          git -c user.name="ralph-tb-executor" -c user.email="ralph-tb@users.noreply.github.com" commit -q -F "$RUNNER_TEMP/msg"
          # Duplicate guard with three explicit outcomes (git ls-remote --exit-code):
          #   0 = op/<id> exists -> refuse;  2 = confirmed absent -> continue;
          #   anything else (e.g. 128 query failure) = unknown -> STOP without pushing.
          # The push itself is never forced.
          lsrc=0
          git ls-remote --exit-code origin "refs/heads/op/$OP" >/dev/null || lsrc=$?
          case "$lsrc" in
            0) echo 'REJECTED_OP_BRANCH_EXISTS' >&2; exit 1 ;;
            2) ;;
            *) echo "STOP_REMOTE_QUERY_FAILED rc=$lsrc (no push)" >&2; exit 1 ;;
          esac
          git push origin "HEAD:refs/heads/op/$OP"
          echo "candidate=$(git rev-parse HEAD) patch_sha256=$patch_sha" >> "$GITHUB_STEP_SUMMARY"
